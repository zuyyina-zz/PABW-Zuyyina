<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Saya - P11</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="komponen.css">
  <link rel="stylesheet" href="tema.css">
  <link rel="stylesheet" href="responsif.css">
</head>
<body>
  <header>
    <h1 id="nama-profil">Profil Mahasiswa</h1>
    <p id="peran-profil"></p>
    <p id="keahlian-profil"></p>
  </header>

  <main>
    <section>
      <h2>Daftar Proyek</h2>
      
      <!-- Tombol Filter Kategori -->
      <div id="filter-kategori">
        <button data-kategori="semua" class="aktif">Semua</button>
        <button data-kategori="web">Web</button>
        <button data-kategori="desain">Desain</button>
        <button data-kategori="aplikasi">Aplikasi</button>
        <button id="atur-ulang">Atur ulang</button>
      </div>

      <!-- Indikator Status -->
      <p id="memuat" hidden>Memuat data proyek...</p>
      <p id="pesan-galat" hidden style="color: red;"></p>
      <p id="kosong" hidden>Tidak ada proyek dalam kategori ini.</p>

      <!-- Wadah Daftar Proyek -->
      <ul id="daftar"></ul>
    </section>
  </main>

  <!-- Hanya satu baris penanggan modul JavaScript -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
